# vulnweb — intentionally-weak nginx surfaces for probe positive validation.
server {
    listen 80 default_server;
    server_name _;

    # httpx (PS-007/020 · CWE-693): expose the version banner "nginx/<ver>".
    server_tokens on;

    root /usr/share/nginx/html;
    index index.html;

    # Corsy (PS-021 · CWE-346): reflect a wildcard ACAO on every response.
    add_header Access-Control-Allow-Origin "*" always;

    # observation dormant (cookie flags): a session cookie WITHOUT Secure/
    # HttpOnly/SameSite. Produces no finding today (well-known/Set-Cookie
    # provider path not wired for this target) — surface seeded for later reuse.
    add_header Set-Cookie "sid=abc123def4567890abcdef1234567890; Path=/" always;

    # humble (PS-001/024 · CWE-319 + CWE-1021): NO Strict-Transport-Security,
    # NO X-Frame-Options, NO Content-Security-Policy are set anywhere → HSTS
    # missing + clickjacking unprotected.

    location / {
        try_files $uri $uri/ =404;
    }

    # dirhunt (PS-004 · CWE-548): an autoindex-enabled directory listing.
    location /listing/ {
        autoindex on;
    }

    # observation dormant (PS-018 session-in-URL): a redirect that puts a
    # session-looking token in the URL. No finding today (dormant surface).
    location = /go {
        return 302 "/?sid=0123456789abcdef0123456789abcdef";
    }

    # observation PS-010 (.git exposure): serve a fake /.git/config and /.git/HEAD.
    # config content lives on disk as dot-git-config because git will not track a
    # literal `.git/` directory inside the repo; nginx aliases the real path back.
    location = /.git/config {
        default_type text/plain;
        alias /usr/share/nginx/html/dot-git-config;
    }
    location = /.git/HEAD {
        default_type text/plain;
        return 200 "ref: refs/heads/main\n";
    }

    # observation PS-013 (admin page reachable without auth): a plain admin page
    # served at a well-known admin path, with NO login form and no SPA/login
    # marker — so the admin signature fires (the FP corpus covers the login/SPA
    # cases that must NOT fire).
    location = /admin {
        default_type text/html;
        return 200 "<html><body><h1>Admin Panel</h1><p>user management console</p></body></html>";
    }
}

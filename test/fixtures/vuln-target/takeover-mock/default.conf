# takeover-mock — returns a subdomain-takeover fingerprint body for subzy.
#
# IQ4=A: body-only match (no CNAME manipulation). The body is the Campaign Monitor
# takeover fingerprint from the real can-i-take-over-xyz DB (EdOverflow), chosen
# because its entry has an EMPTY cname list (`"cname": []`) and `"vulnerable":
# true` — so subzy flags it on body match alone, with no CNAME/DNS setup. The DB
# itself is provided to subzy unmodified (see the fixture README / Code Gen Step 3).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location / {
        default_type text/html;
        return 200 "Trying to access your account?";
    }
}

# chiller CI.
#
# This pipeline exists for one reason: the durable WorkQueue shipped BROKEN in two
# consecutive increments while Build&Test was green both times. The Valkey `Drain`
# bug — which made StopScan not actually stop a scan — was found only when someone
# ran the container-backed suite by hand, after the fact. A pipeline that compiles
# and runs unit tests would still be green with that bug in it today.
#
# So the load-bearing gate here is `integration` (CI-FR-03): real Mongo, real
# Valkey, on every pull request. Everything else supports it.
#
# Supply chain (SECURITY-10/13): every Action is pinned by commit SHA, every tool by
# an exact version (see Makefile), every image by digest. No floating tags anywhere.
# The pipeline holds ZERO secrets — it builds an image but never pushes one, and
# deploys nothing. A compromised workflow here has nothing to steal.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Opt-in (IQ2=A): the vuln-target fixture positive suite is heavy (stands up the
  # fixture, scans public badssl) — run it on demand, not on every push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback. Deliberately NOT downstream of `integration` (CI-NFR-03): a
  # compile error must surface in minutes, not after the container suite finishes.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Reads the version from go.mod, so CI and go.mod cannot drift apart.
          go-version-file: go.mod
          # Cache on PRs for speed; NO cache on the push to main, so what lands on
          # the default branch is always built from nothing (CI-NFR-04). A stale or
          # poisoned cache can never become the artifact of record.
          cache: ${{ github.event_name == 'pull_request' }}

      - name: build
        run: make build

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # NFR-02: the data plane must not import the control plane. Enforced twice —
      # here without golangci-lint, and again by depguard inside `make lint` — so
      # the rule survives either tool going missing.
      - name: arch-check
        run: make arch-check

      - name: lint
        run: make lint

      - name: gosec
        run: make gosec

      - name: unit tests (-race)
        run: make test

      # Reported, not blocking (C1=D). A stdlib CVE published this morning is not
      # actionable by whoever is fixing a typo; blocking on it trains people to
      # ignore red.
      - name: govulncheck (report only)
        continue-on-error: true
        run: make vuln

      - name: coverage (report only)
        continue-on-error: true
        run: make cover

  # THE reason this pipeline exists. Real Mongo + real Valkey via testcontainers.
  integration:
    runs-on: ubuntu-latest
    # Backstop only. `go test -timeout 10m` (see Makefile) fires first and panics
    # with a full goroutine dump, so a hang tells us WHERE, not just THAT.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name == 'pull_request' }}

      - name: integration tests (real Mongo + Valkey)
        run: make test-integration

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 is load-bearing. gitleaks scans HISTORY, not the working
          # tree. With the default shallow clone it would examine almost nothing and
          # report green — a gate that inspects nothing but passes, which is exactly
          # the failure this repo already had with .golangci.yml.
          fetch-depth: 0

      - name: secret scan (full history)
        run: make secrets

      # Built, scanned, discarded. Never pushed: no registry, no credentials, no
      # blast radius. Also proves the Dockerfile still builds — without this the
      # image could break and CI would stay green.
      - name: docker build (no push)
        run: docker build -t chiller:ci .

      - name: trivy image scan (report only)
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --severity HIGH,CRITICAL --no-progress chiller:ci

  # Probe integration (Q4=C / IQ4=A): the wired probes' real os/exec + real-output
  # parse path, exercised INSIDE the built image where the pinned tool binaries
  # actually exist. The runtime image has no Go toolchain, so we compile a static
  # `-tags integration` test binary on the host and run it in the image. This is
  # the first place the hand-authored parser schemas meet real tool output (F6);
  # a schema drift fails here. Host-scoped probes skip unless PROBE_TEST_HOST is set.
  probe-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build probe image (tools bundled)
        run: docker build -t chiller:ci .

      - name: compile integration test binary (static)
        run: CGO_ENABLED=0 go test -c -tags integration -o /tmp/probe.test ./internal/scan/checking/probe/

      - name: run probe integration inside the image (real binaries)
        # Run ONLY the //go:build integration tests in the image. The unit tests
        # compiled into the same binary (parser goldens, exec-pgroup, missing-
        # binary honesty) belong to the `fast` job: they need testdata/ (not in
        # the image) and assume NO tool binaries are present — both false here.
        # --init gives the test binary a real PID 1 that reaps subprocesses.
        run: |
          docker run --rm --init --entrypoint /probe.test \
            -v /tmp/probe.test:/probe.test:ro \
            chiller:ci -test.v -test.run TestIntegration

      - name: SBOM
        continue-on-error: true
        run: make sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: warn

  # Opt-in positive-finding proof (IQ2=A, #0d r9): stand up the committed
  # vuln-target fixture and prove the host-scoped probes extract a REAL finding —
  # dirhunt (autoindex → CWE-548), subzy (takeover fingerprint → NoCanonicalCWE),
  # testssl (rc4.badssl.com weak TLS → CWE-1327). Only runs on manual dispatch:
  # it depends on the public badssl service and is heavier than the always-on
  # gates. The base `probe-integration` job already runs these same tests, but
  # their per-probe env is unset there so each positive check skips (CI green).
  probe-fixture-positive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: build probe image (tools bundled)
        run: docker build -t chiller:ci .

      - name: compile integration test binary (static)
        run: CGO_ENABLED=0 go test -c -tags integration -o /tmp/probe.test ./internal/scan/checking/probe/

      - name: stand up the vuln-target fixture
        run: docker compose -f test/fixtures/vuln-target/docker-compose.yml up -d --wait

      - name: provision subzy fingerprints DB (#0e — pinned; subzy's self-fetch URL is dead)
        run: make subzy-db   # → deploy/subzy/fingerprints.json (pinned by SUBZY_DB_COMMIT)

      - name: prove positive findings in-image on the fixture network
        # Join the fixture's vulnnet (reaches vulnweb/takeover-mock by name) — it
        # also has egress, so testssl can reach badssl. Mount the fingerprints DB at
        # /opt/subzy (SUBZY_DB); the subzy adapter runs subzy with HOME=/opt so it
        # reads /opt/subzy/fingerprints.json instead of self-fetching. --init reaps
        # probe subprocesses (PID 1).
        run: |
          docker run --rm --init --network chiller-vuln-target_vulnnet \
            --entrypoint /probe.test \
            -v /tmp/probe.test:/probe.test:ro \
            -v "$PWD/deploy/subzy/fingerprints.json:/opt/subzy/fingerprints.json:ro" \
            -e PROBE_FIXTURE_DIRHUNT=vulnweb \
            -e PROBE_FIXTURE_SUBZY=takeover-mock \
            -e PROBE_BADSSL_HOST=rc4.badssl.com \
            chiller:ci -test.v -test.run 'TestIntegration_(URLProbes|FixtureProbes)'

      - name: prove well-known observation findings against the fixture
        # Run the orchestrator well-known sweep (r10) against vulnweb from a
        # container on the fixture network. Target the container IP, not the
        # compose name: the scan Fetcher's own DNS resolver does not see Docker's
        # embedded DNS (a real DNS name resolves fine).
        run: |
          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' chiller-vuln-target-vulnweb-1)
          docker run --rm --network chiller-vuln-target_vulnnet \
            -v "$PWD":/src -w /src -v "$(go env GOMODCACHE)":/go/pkg/mod \
            -e WELLKNOWN_FIXTURE_URL=http://$IP/ -e GOFLAGS=-buildvcs=false \
            golang:1.26.5 \
            go test -tags integration -run TestIntegration_WellKnown_Fixture ./test/ -v

      - name: tear down fixture
        if: always()
        run: docker compose -f test/fixtures/vuln-target/docker-compose.yml down -v

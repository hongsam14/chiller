# Stateful backends (multi-AZ, Q6=B/Q9=C). Minimal reference skeletons — storage
# class, AZ topology-spread, TLS/auth config, and backup CronJobs are finalized
# with the target cluster (Operations). Pin images by digest (SECURITY-10).
---
# Mongo: 3-node replica set (RESILIENCY-08), majority write-concern (Q12=B).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chiller-mongo
  labels: { app: chiller, role: mongo }
spec:
  serviceName: chiller-mongo
  replicas: 3
  selector: { matchLabels: { app: chiller, role: mongo } }
  template:
    metadata:
      labels: { app: chiller, role: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7 # SECURITY-10: pin @sha256; enable TLS + auth (SECURITY-01/09)
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: chiller-mongo
spec:
  clusterIP: None
  selector: { app: chiller, role: mongo }
  ports: [{ port: 27017 }]
---
# Valkey queue: durable (AOF, noeviction). Separate from the cache (Q9=C).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chiller-valkey-queue
  labels: { app: chiller, role: valkey-queue }
spec:
  replicas: 1
  selector: { matchLabels: { app: chiller, role: valkey-queue } }
  template:
    metadata:
      labels: { app: chiller, role: valkey-queue }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8 # SECURITY-10: pin @sha256; require auth (SECURITY-09)
          args: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: chiller-valkey-queue
spec:
  selector: { app: chiller, role: valkey-queue }
  ports: [{ port: 6379 }]

# Resident worker pool (Q2=B): consumes the shared Valkey stream (group `workers`).
# Scaled by queue depth via HPA (RESILIENCY-09). Not per-scan.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chiller-worker
  labels: { app: chiller, role: worker }
spec:
  replicas: 2
  selector: { matchLabels: { app: chiller, role: worker } }
  template:
    metadata:
      labels: { app: chiller, role: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # fsGroup makes the /scratch emptyDir group-owned + group-writable so the
        # non-root user can create probe temp files there under a read-only root FS.
        fsGroup: 10001
      containers:
        - name: chiller
          image: chiller:REPLACE_WITH_DIGEST # SECURITY-10
          args:
            - "--role=worker"
            - "--store=mongo"
            - "--queue=valkey"
            # Workers fetch, so they are the cache's main user. Every worker MUST
            # point at the same cache instance (chiller-valkey-cache) or nothing is
            # reused across them and the target is fetched once per worker (FR-02).
            - "--cache=valkey"
            # Workers DO finalize: whichever worker drains the last item of a scan
            # assembles and stores its findings (maybeFinalize). A worker with
            # --findings-store=mem would write that scan's results into its own
            # process memory and lose them, so this is not optional.
            - "--findings-store=mongo"
            - "--mongo-db=chiller"
          envFrom:
            - secretRef: { name: chiller-secrets }
          env:
            # Probe CLIs (dirhunt cache, testssl temp) need a writable dir; the
            # root FS is read-only (NFR-P4), so steer all tool scratch here.
            - { name: TMPDIR, value: /scratch }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # Ephemeral per-pod scratch for probe subprocess temp files (IQ5=B —
            # disk emptyDir). Cleared on pod termination; holds no captured bodies
            # beyond a run (FR-12 stays with ResponseCache.WipeScan).
            - { name: scratch, mountPath: /scratch }
            # subzy's takeover-fingerprint DB (#0e), read-only, at /opt/subzy (matches
            # SUBZY_DB; the adapter runs subzy with HOME=/opt so it reads
            # /opt/subzy/fingerprints.json). Provision the ConfigMap out-of-band:
            #   make subzy-db && kubectl create configmap subzy-db \
            #     --from-file=fingerprints.json=deploy/subzy/fingerprints.json
            # Without it, subzy self-fetches, fails, and PS-025 is honestly tool-failed.
            - { name: subzy-db, mountPath: /opt/subzy, readOnly: true }
      volumes:
        - name: scratch
          emptyDir: {}
        - name: subzy-db
          # optional: a missing ConfigMap must NOT stall the pod (which would take ALL
          # probes down). Absent → the mount is empty → subzyDBGuard fails → PS-025 is
          # honestly tool-failed while every other probe keeps running (#0e).
          configMap: { name: subzy-db, optional: true }
---
# HPA on queue depth. The CPU trigger below is a portable placeholder; the
# production trigger is a KEDA ScaledObject on the Valkey stream length (XLEN of
# chiller:queue:stream) — finalized in Operations with the chosen fleet.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chiller-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chiller-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

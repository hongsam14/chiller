# EXAMPLE ONLY — do NOT commit real secrets (SECURITY-12). Create the real Secret
# out-of-band (sealed-secrets / external-secrets / vault). Values shown are
# placeholders. Connection strings must enforce TLS (SECURITY-01), e.g.
# mongodb://user:pass@host/?tls=true&w=majority
apiVersion: v1
kind: Secret
metadata:
  name: chiller-secrets
type: Opaque
stringData:
  CHILLER_MONGO_URI: "mongodb://USER:PASS@chiller-mongo:27017/?replicaSet=rs0&tls=true&w=majority"
  CHILLER_VALKEY_ADDR: "chiller-valkey-queue:6379"
  CHILLER_VALKEY_PASSWORD: "REPLACE_ME"
  # The cache is a SEPARATE Valkey instance from the queue (see backends.yaml).
  # Every worker must point at the same one, or cross-worker fetch reuse silently
  # stops happening (FR-02).
  CHILLER_VALKEY_CACHE_ADDR: "chiller-valkey-cache:6379"
  CHILLER_VALKEY_CACHE_PASSWORD: "REPLACE_ME"
  # AES-256 key (32 bytes, base64) sealing finding evidence and cached responses.
  # Generate with:  openssl rand -base64 32
  # A process started with a durable backend and no key REFUSES TO START.
  # To rotate: prepend a new key, keeping the old one readable, and NAME BOTH —
  #   CHILLER_EVIDENCE_KEY: "k2:<new-base64>,k1:<old-base64>"
  # The first entry seals new values; the rest stay available to open old ones.
  # Once there is more than one key every entry MUST carry its id: an envelope
  # records the id it was sealed under, so the id has to keep naming the same key
  # bytes across a rotation. A lone un-prefixed key is "k1" — which is why the old
  # key stays "k1" above. chiller refuses to start on an unnamed key in a multi-key
  # spec rather than guess.
  CHILLER_EVIDENCE_KEY: "REPLACE_ME_OPENSSL_RAND_BASE64_32"
  CHILLER_TOKEN: "REPLACE_ME_STRONG_RANDOM"
---
# storageState for the singleton auth-proxy (financial mode). Mount, never log.
apiVersion: v1
kind: Secret
metadata:
  name: chiller-storage-state
type: Opaque
stringData:
  storageState.json: "{}" # replace with the pre-authenticated Playwright state

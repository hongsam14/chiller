# EXAMPLE ONLY — do NOT commit real secrets (SECURITY-12). Create the real Secret
# out-of-band (sealed-secrets / external-secrets / vault). Values shown are
# placeholders. Connection strings must enforce TLS (SECURITY-01), e.g.
# mongodb://user:pass@host/?tls=true&w=majority
apiVersion: v1
kind: Secret
metadata:
  name: chiller-secrets
type: Opaque
stringData:
  CHILLER_MONGO_URI: "mongodb://USER:PASS@chiller-mongo:27017/?replicaSet=rs0&tls=true&w=majority"
  CHILLER_VALKEY_ADDR: "chiller-valkey-queue:6379"
  CHILLER_VALKEY_PASSWORD: "REPLACE_ME"
  CHILLER_TOKEN: "REPLACE_ME_STRONG_RANDOM"
---
# storageState for the singleton auth-proxy (financial mode). Mount, never log.
apiVersion: v1
kind: Secret
metadata:
  name: chiller-storage-state
type: Opaque
stringData:
  storageState.json: "{}" # replace with the pre-authenticated Playwright state

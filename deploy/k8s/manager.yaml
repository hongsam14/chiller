# Resident control plane (Q3=A): API + FSM + fold + dashboard. replicas: 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chiller-manager
  labels: { app: chiller, role: manager }
spec:
  replicas: 1
  selector: { matchLabels: { app: chiller, role: manager } }
  template:
    metadata:
      labels: { app: chiller, role: manager }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: chiller
          image: chiller:REPLACE_WITH_DIGEST # SECURITY-10: pin @sha256 in prod
          args:
            - "--role=manager"
            - "--addr=0.0.0.0:8080"
            - "--store=mongo"
            - "--queue=valkey"
            - "--findings-store=mongo"
            # The manager needs a cache handle even though it does not fetch: it is
            # what wipes a scan's cached responses when the scan ends (FR-12).
            - "--cache=valkey"
            - "--mongo-db=chiller"
          envFrom:
            - secretRef: { name: chiller-secrets }
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: http } # deep: Mongo + Valkey ping
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: chiller-manager
spec:
  selector: { app: chiller, role: manager }
  ports:
    - { name: http, port: 8080, targetPort: http }

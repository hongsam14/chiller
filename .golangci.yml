# chiller lint config (golangci-lint v2 schema).
#
# The depguard rules mechanically enforce NFR-02 (control/data-plane one-way
# dependency) — see unit-of-work-dependency.md §6. `make arch-check` enforces the
# same rule without golangci-lint installed; both exist so the rule survives
# either tool going missing.
version: "2"

linters:
  default: standard
  enable:
    - depguard

  settings:
    depguard:
      rules:
        data-plane:
          files:
            - "**/internal/scan/**"
            - "**/internal/findings/**"
          deny:
            - pkg: "github.com/hongsam14/chiller/internal/platform"
              desc: "data plane must not depend on control plane (NFR-02)"
        domain-kernel:
          files:
            - "**/internal/domain/**"
          deny:
            - pkg: "github.com/hongsam14/chiller/internal/platform"
              desc: "domain kernel must import no unit (NFR-02, acyclic)"
            - pkg: "github.com/hongsam14/chiller/internal/scan"
              desc: "domain kernel must import no unit (NFR-02, acyclic)"
            - pkg: "github.com/hongsam14/chiller/internal/findings"
              desc: "domain kernel must import no unit (NFR-02, acyclic)"

  exclusions:
    # The scratch worktree under .claude/ is untracked build debris, not source.
    # CI never sees it (git does not track it), but a local run would otherwise
    # report every finding twice.
    paths:
      - "\\.claude/"
